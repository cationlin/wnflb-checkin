name: keepalive

on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Keepalive commit
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          echo keepalive $(date -u) > .keepalive
          git add .keepalive
          git commit -m keepalive_$(date -u) || echo nothing
          git push origin main
