name: keepalive

on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Keepalive commit
        run: |
          echo keepalive $(date -u) > .keepalive
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add .keepalive
          git commit -m keepalive_$(date -u) && git pull --rebase && git push || echo skip
