name: keepalive

on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Keepalive commit
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cationlin/wnflb-checkin.git
          git checkout -B keepalive
          git commit --allow-empty -m keepalive_$(date -u +%Y%m%dT%H%M%SZ)
          git push origin keepalive
